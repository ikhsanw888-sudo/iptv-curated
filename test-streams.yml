name: Test IPTV streams

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test all streams
        run: python test_streams.py

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: stream-test-report
          path: reports/

      - name: Save report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada laporan."
          else
            git commit -m "Update IPTV stream test report"
            git push
          fi
